# ============================================================================
# Nginx - Proxy inverso hacia el backend desplegado en RENDER
#
# Usa este archivo (en vez de taller-mecanico.conf) cuando tu API Node/Express
# NO corre en la misma maquina que Nginx, sino como un Web Service de Render
# (https://dashboard.render.com). Render expone tu servicio en una URL publica
# tipo https://taller-mecanico-api.onrender.com y termina el TLS por su cuenta;
# aqui Nginx simplemente reenvia /api/ hacia esa URL por internet.
#
# Reemplaza "taller-mecanico-api.onrender.com" por el hostname real que Render
# te asigno (o por tu dominio personalizado si lo agregaste en Render).
# ============================================================================

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# Resolver DNS publico + cache corto: Render puede cambiar la IP detras de su
# hostname (balanceo/autoscaling), asi que NO conviene resolverla una sola vez.
resolver 1.1.1.1 8.8.8.8 valid=30s;

# --- Redirige HTTP -> HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name tudominio.com www.tudominio.com;

    return 301 https://$host$request_uri;
}

# --- Servidor HTTPS (aqui vive tu dominio publico, ej. donde apunta el DNS) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tudominio.com www.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 5m;

    access_log /var/log/nginx/taller-mecanico.access.log;
    error_log  /var/log/nginx/taller-mecanico.error.log;

    # Nombre del backend en Render. Se guarda en una variable (en vez de
    # ponerlo literal en proxy_pass) para forzar que nginx use el "resolver"
    # de arriba y vuelva a resolver el DNS periodicamente, en vez de cachear
    # una sola IP para siempre.
    set $render_backend "taller-mecanico-api.onrender.com";

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass https://$render_backend/api/;
        proxy_http_version 1.1;

        # --- Imprescindible al proxyar hacia un PaaS multi-tenant como Render ---
        # 1) SNI: sin esto, el handshake TLS puede fallar o enrutar mal, porque
        #    Render sirve muchas apps distintas detras del mismo balanceador.
        proxy_ssl_server_name on;
        # 2) Host: debe ser el hostname de Render (NO tu dominio propio), ya que
        #    Render usa el header Host para decidir a cual servicio entregar la
        #    peticion. Si mandas tu propio dominio aqui, Render no sabra a que
        #    Web Service corresponde y la peticion fallara (404 / servicio erroneo).
        proxy_set_header Host $render_backend;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts mas generosos: en el plan gratuito de Render el servicio se
        # "duerme" tras ~15 min sin trafico y el primer request tras despertar
        # puede tardar 30-60s (cold start). Si usas un plan pago (siempre activo)
        # puedes bajar estos valores a los de taller-mecanico.conf (10s/30s/30s).
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /api/health {
        proxy_pass https://$render_backend/api/health;
        proxy_ssl_server_name on;
        proxy_set_header Host $render_backend;
    }

    # --- (Opcional) Servir el frontend ya compilado desde este mismo dominio ---
    # root /var/www/taller-mecanico/frontend;
    # index index.html;
    #
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }
}
