# ============================================================================
# Nginx - Proxy inverso para la API del Taller Mecanico (Node.js/Express)
#
# ESTE ARCHIVO ASUME QUE NODE CORRE EN LA MISMA MAQUINA QUE NGINX (127.0.0.1:4000).
# Si el backend esta desplegado en Render (u otro PaaS), usa en su lugar
# nginx/taller-mecanico-render.conf, que apunta a la URL publica del servicio.
#
# Copiar a /etc/nginx/sites-available/taller-mecanico.conf y enlazar en
# /etc/nginx/sites-enabled/, luego: sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

# Zona de limitacion de tasa (proteccion basica anti abuso sobre /api)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# --- Redirige HTTP -> HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name api.tudominio.com;

    return 301 https://$host$request_uri;
}

# --- Servidor HTTPS ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.tudominio.com;

    # Certificados (ej. generados con certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/api.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tudominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Cabeceras de seguridad adicionales (Express/helmet ya agrega varias)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 5m;

    access_log /var/log/nginx/taller-mecanico.access.log;
    error_log  /var/log/nginx/taller-mecanico.error.log;

    # --- Proxy hacia la API Node/Express (RF-01 a RF-10) ---
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts razonables para reportes/operaciones mas pesadas
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Endpoint de salud sin limite de tasa (para balanceadores / monitoreo)
    location = /api/health {
        proxy_pass http://127.0.0.1:4000/api/health;
    }

    # --- (Opcional) Servir el frontend ya compilado desde el mismo dominio ---
    # Descomentar si se desea que nginx sirva tambien los archivos estaticos
    # del frontend (por ejemplo build de React/Angular) junto con la API.
    #
    # root /var/www/taller-mecanico/frontend;
    # index index.html;
    #
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }
}
